[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localintent"
version = "1.0.0"
description = "Outcome-specific structured generation for local smart building automation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "LocalIntent contributors"}]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
localintent = "localintent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localintent = ["prompts/*.txt", "prompts/*/*.txt"]
